# Déclenche un rebuild Vercel à chaque push sur main.
# Nécessaire parce que Vercel Hobby (gratuit) n'auto-deploy que les pushs
# de l'owner du projet. Ce workflow ping le Deploy Hook Vercel pour que
# n'importe quel collaborator (Léa, Mathieu, futurs) déclenche un build.
#
# Setup :
#   - Deploy Hook Vercel créé sur Settings → Git → Deploy Hooks (branch: main)
#   - URL stockée dans GitHub Secrets sous VERCEL_DEPLOY_HOOK_URL

name: Trigger Vercel deploy on push to main

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel deploy hook
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "❌ VERCEL_DEPLOY_HOOK_URL secret is not set on this repo."
            echo "   Add it via Settings → Secrets and variables → Actions."
            exit 1
          fi

          echo "🚀 Triggering Vercel deploy for commit ${GITHUB_SHA:0:7}..."
          RESPONSE=$(curl -sS -X POST -w "\n%{http_code}" "$HOOK_URL")
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP $STATUS"
          echo "$BODY"

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "❌ Deploy hook returned non-success. Check the URL secret."
            exit 1
          fi

          echo "✅ Vercel deploy triggered — check vercel.com/pimili7/lea-drainage/deployments"
